[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fastvision"
version = "0.3.0"
description = "Zero-fine-tuning visual token pruning wrapper for Hugging Face multimodal LLMs"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
authors = [{ name = "FastVision contributors" }]
dependencies = [
    "torch>=2.1",
    "transformers>=4.45",
]
keywords = ["multimodal", "llm", "token-pruning", "inference", "vision"]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.4"]
bench = ["datasets", "matplotlib", "pandas", "pillow", "numpy"]
docs = ["mkdocs-material>=9"]

[project.urls]
Homepage = "https://github.com/Cekaru/fastvision"
Documentation = "https://Cekaru.github.io/fastvision"
Changelog = "https://github.com/Cekaru/fastvision/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
include = ["fastvision*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
